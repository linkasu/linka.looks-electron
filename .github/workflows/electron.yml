name: Electron build

# v-tags must never rebuild/publish unaccepted bytes. This only promotes a completed run.
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: "Successful main 3.3.1 candidate run containing both accepted platforms"
        required: true
        type: string
      sha:
        description: "Exact accepted application SHA (in main history)"
        required: true
        type: string
      tooling_sha:
        description: "Exact accepted candidate workflow/tooling SHA (in main history)"
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: release-331-promotion
  cancel-in-progress: false

jobs:
  promote:
    if: github.ref == 'refs/heads/main' && github.repository == 'linkasu/linka.looks-electron'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      actions: read
    env:
      APP_SHA: ${{ inputs.sha }}
      TOOLING_SHA: ${{ inputs.tooling_sha }}
      ACCEPTED_RUN: ${{ inputs.run_id }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.2
          cache: npm
      - name: Require immutable main sources and terminal exact-head technical gates
        shell: bash
        run: |
          set -euo pipefail
          ACCEPTANCE_SHA="$APP_SHA" node scripts/ci/validate-acceptance-target.mjs
          ACCEPTANCE_SHA="$TOOLING_SHA" node scripts/ci/validate-acceptance-target.mjs
          [[ "$ACCEPTED_RUN" =~ ^[0-9]+$ ]]
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$ACCEPTED_RUN" > "$RUNNER_TEMP/run.json"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$ACCEPTED_RUN/jobs?per_page=100" > "$RUNNER_TEMP/jobs.json"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs?head_sha=$APP_SHA&per_page=100" > "$RUNNER_TEMP/gates.json"
          node <<'NODE'
          const fs = require('node:fs');
          const assert = require('node:assert/strict');
          const load = name => JSON.parse(fs.readFileSync(`${process.env.RUNNER_TEMP}/${name}.json`));
          const run = load('run');
          assert.equal(String(run.id), process.env.ACCEPTED_RUN);
          assert.equal(run.head_sha, process.env.TOOLING_SHA);
          assert.equal(run.head_repository.full_name, process.env.GITHUB_REPOSITORY);
          assert.equal(run.head_branch, 'main');
          assert.equal(run.path, '.github/workflows/release-331-preflight.yml');
          assert.equal(run.event, 'workflow_dispatch');
          assert.equal(run.status, 'completed');
          assert.equal(run.conclusion, 'success');
          const jobs = load('jobs').jobs;
          for (const name of ['target', 'signed-macos', 'release-windows']) {
            const matches = jobs.filter(job => job.name === name);
            assert.equal(matches.length, 1);
            assert.equal(matches[0].conclusion, 'success');
          }
          const runs = load('gates').workflow_runs;
          for (const name of ['Checks', 'Electron test', 'Release acceptance (test only)', '3.3.1 build-only preflight']) {
            const latest = runs.filter(r => r.name === name && r.event === 'pull_request')
              .sort((a,b) => b.id - a.id)[0];
            assert(latest, `missing exact-head gate: ${name}`);
            assert.equal(latest.head_sha, process.env.APP_SHA);
            assert.equal(latest.status, 'completed');
            assert.equal(latest.conclusion, 'success', `failed exact-head gate: ${name}`);
          }
          NODE
      - name: Download accepted bytes from that run only
        run: |
          gh run download "$ACCEPTED_RUN" --repo "$GITHUB_REPOSITORY" --name "accepted-331-windows-$ACCEPTED_RUN" --dir accepted
          gh run download "$ACCEPTED_RUN" --repo "$GITHUB_REPOSITORY" --name "accepted-331-macos-$ACCEPTED_RUN" --dir accepted
      - name: Recheck exact bytes, mandatory assets, updater semantics and provenance
        run: |
          npm ci --ignore-scripts
          node --test scripts/ci/release-artifacts.test.cjs
          node scripts/ci/release-artifacts.cjs verify accepted "$APP_SHA" "$TOOLING_SHA" "$ACCEPTED_RUN"
      - name: Refuse tag/release collisions, then create a draft from accepted bytes only
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git ls-remote origin refs/tags/v3.3.1 refs/tags/3.3.1)"
          gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" > "$RUNNER_TEMP/releases.json"
          node -e 'const r=require(process.env.RUNNER_TEMP+"/releases.json"); if(r.some(x=>["v3.3.1","3.3.1"].includes(x.tag_name))) throw Error("Release collision")'
          gh release create v3.3.1 accepted/* --repo "$GITHUB_REPOSITORY" --target "$APP_SHA" --draft --title "LINKa.смотри 3.3.1" --notes-file docs/security/139/release-331-notes.md
          echo "Draft contains accepted bytes only; publishing requires the authorized operator to verify assets and publish (which triggers the updater mirror)." >> "$GITHUB_STEP_SUMMARY"
