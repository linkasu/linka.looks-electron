name: Electron build

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
jobs:
  build:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v4

    - name: Use Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 22.x
        cache: 'npm'

    - name: Install deps
      run: npm ci
    - name: Linter
      run: npm run lint
    - name: Unit tests
      run: npm run test:unit
    - name: Build unpacked app for packaged resource smoke test
      run: npm run electron:build -- --dir
    - name: Packaged resource smoke test
      run: npm run test:packaged-resources
    - name: Build installer
      if: ${{ !startsWith(github.ref, 'refs/tags/') }}
      run: npm run electron:build -- -p never
    - name: Build and publish
      if: ${{ startsWith(github.ref, 'refs/tags/') }}
      run: npm run electron:build -- -p always
      env:
        GH_TOKEN: ${{secrets.GH_TOKEN}}
