name: 4.0.0 build-only preflight

on:
  pull_request:
    types: [opened, reopened, synchronize]
    branches: [main]
  workflow_dispatch:
    inputs:
      sha:
        description: "Exact 40-hex 4.0.0 app SHA in main history (no tag)"
        required: true
        type: string
      tooling_sha:
        description: "Exact 40-hex workflow/tooling SHA (must equal workflow main revision)"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-400-preflight-${{ github.ref }}
  cancel-in-progress: false

jobs:
  target:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      app: ${{ steps.target.outputs.app }}
      tooling: ${{ steps.target.outputs.tooling }}
    steps:
      - name: Reject untrusted dispatch before checkout
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          test "$GITHUB_REF" = refs/heads/main
          test "$GITHUB_REPOSITORY" = linkasu/linka.looks-electron
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.2
      - name: Validate immutable sources before application execution
        id: target
        shell: bash
        env:
          ACCEPTANCE_SHA: ${{ inputs.sha }}
          PR_SHA: ${{ github.event.pull_request.head.sha }}
          EXPECTED_TOOLING_SHA: ${{ inputs.tooling_sha }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            test "$GITHUB_SHA" = "$EXPECTED_TOOLING_SHA"
            app=$(node scripts/ci/validate-acceptance-target.mjs)
          else
            app="$PR_SHA"
          fi
          test "$(git show "$app:package.json" | node -e 'let s="";process.stdin.on("data",c=>s+=c).on("end",()=>process.stdout.write(JSON.parse(s).version))')" = 4.0.0
          echo "app=$app" >> "$GITHUB_OUTPUT"
          echo "tooling=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  unsigned:
    if: github.event_name == 'pull_request'
    needs: target
    runs-on: windows-2022
    timeout-minutes: 35
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
      CANDIDATE_BUILDER: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.target.outputs.app }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.2
          cache: npm
      - name: Install locked candidate (no legacy lifecycle)
        run: |
          npm ci --ignore-scripts
          npm rebuild pictures.bank-api esbuild electron
          node scripts/ci/provision-eyelog.cjs
      - name: Strict release contract negative controls (no credentials)
        run: node --test scripts/ci/release-331-preflight.test.cjs scripts/ci/release-artifacts.test.cjs scripts/ci/verify-predictor-resources.test.cjs
      - name: Build unsigned Windows x64 installer once (never publish)
        run: npm run electron:build -- --win --x64 -p never
      - name: Packaged resources and real component inventory
        shell: bash
        env:
          APP_SHA: ${{ needs.target.outputs.app }}
          TOOLING_SHA: ${{ needs.target.outputs.tooling }}
        run: |
          set -euo pipefail
          npm run test:packaged-resources
          node scripts/ci/release-inventory.cjs
          git diff --exit-code
      - name: Upload source pins and inventories only (NO binaries)
        uses: actions/upload-artifact@v4
        with:
          name: preflight-400-${{ runner.os }}-${{ needs.target.outputs.app }}
          retention-days: 7
          if-no-files-found: error
          path: release-evidence/inventory.json

  release-windows:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && github.repository == 'linkasu/linka.looks-electron'
    needs: target
    runs-on: windows-2022
    timeout-minutes: 45
    env:
      APP_SHA: ${{ needs.target.outputs.app }}
      TOOLING_SHA: ${{ needs.target.outputs.tooling }}
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
      CANDIDATE_BUILDER: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.target.outputs.tooling }}
          path: tooling
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.target.outputs.app }}
          path: app
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.2
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Build unsigned Windows x64 installer once (no publication)
        working-directory: app
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$APP_SHA"
          test "$(git -C ../tooling rev-parse HEAD)" = "$TOOLING_SHA"
          npm ci --ignore-scripts
          npm rebuild pictures.bank-api esbuild electron
          node scripts/ci/provision-eyelog.cjs
          npm run electron:build -- --win --x64 -p never
          node ../tooling/scripts/ci/verify-predictor-resources.cjs dist/win-unpacked/resources win32 x64 ../tooling/build/predictor-approval.json
          npm run test:packaged-resources
          node ../tooling/scripts/ci/release-inventory.cjs
          node ../tooling/scripts/ci/release-source-bundle.cjs
          node ../tooling/scripts/ci/release-artifacts-mac-compat.cjs dist
          node ../tooling/scripts/ci/release-artifacts.cjs stage windows
          git diff --exit-code
      - name: Audit exact production lock and staged Windows inventory
        working-directory: app
        shell: bash
        run: |
          set -euo pipefail
          cp package-lock.json release-evidence/package-lock.json
          set +e
          npm audit --omit=dev --json > release-evidence/audit-production.json
          audit_status=$?
          set -e
          case "$audit_status" in
            0|1) ;;
            *) exit "$audit_status" ;;
          esac
          node ../tooling/scripts/ci/release-security-audit.cjs release-evidence/inventory.json release-evidence/audit-production.json release-ready/provenance-windows.json package-lock.json > release-evidence/security-signoff.json
      - name: Save available security evidence even on failure (not accepted assets)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-evidence-400-${{ github.run_id }}
          retention-days: 30
          if-no-files-found: warn
          path: |
            app/release-evidence/inventory.json
            app/release-evidence/audit-production.json
            app/release-evidence/security-signoff.json
            app/release-evidence/package-lock.json
      - name: Save exact Windows and unchanged legacy macOS compatibility bytes
        uses: actions/upload-artifact@v4
        with:
          name: accepted-400-windows-${{ github.run_id }}
          retention-days: 30
          if-no-files-found: error
          path: app/release-ready/
