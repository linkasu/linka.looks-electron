name: Update smoke test

on:
  workflow_dispatch:
    inputs:
      old_version:
        description: "Installed version"
        required: true
        default: "2.7.0"
      new_version:
        description: "Target version"
        required: true
        default: "2.8.0"

jobs:
  update-smoke:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: "npm"

      - name: Install deps
        run: npm ci

      - name: Run update smoke test
        run: pwsh -File scripts/ci/update-smoke.ps1 -OldVersion "${{ inputs.old_version }}" -NewVersion "${{ inputs.new_version }}"

      - name: Upload update log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: update-smoke-log
          path: update-smoke.log
          if-no-files-found: ignore
