name: Electron test

on:
  pull_request:
    types: [opened, reopened, edited, synchronize]
    branches: ["main"]
    paths-ignore:
      - "docs/**"
      - "agents/**"
      - "README*"
      - "**/*.md"

concurrency:
  group: electron-test-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: "npm"

      - name: Cache Electron downloads
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/electron
            ~/.cache/electron-builder
            ~\AppData\Local\electron\Cache
            ~\AppData\Local\electron-builder\Cache
          key: ${{ runner.os }}-electron-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-electron-

      - name: Install deps
        run: |
          npm ci --ignore-scripts
          npm rebuild pictures.bank-api esbuild electron
      - name: Build unpacked app for packaged resource smoke test
        run: npm run electron:build -- --dir -p never
      - name: Packaged resource smoke test
        run: npm run test:packaged-resources
      - name: Production text image generation smoke test
        timeout-minutes: 5
        run: node scripts/ci/run-text-image-smoke.mjs
      - name: Upload text image screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-text-images
          path: test-results/

  build-macos:
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [x64, arm64]
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: "npm"

      - name: Cache Electron downloads
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/electron
            ~/.cache/electron-builder
            ~\AppData\Local\electron\Cache
            ~\AppData\Local\electron-builder\Cache
          key: ${{ runner.os }}-electron-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-electron-

      - name: Install deps
        run: |
          npm ci --ignore-scripts
          npm rebuild pictures.bank-api esbuild electron
      - name: Build unpacked app for packaged resource smoke test
        run: npm run electron:build -- --mac --${{ matrix.arch }} --dir -p never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
      - name: Packaged resource smoke test
        run: npm run test:packaged-resources
      - name: Text image editor smoke test
        run: npx playwright test tests/e2e/text-images.spec.ts
      - name: Production text image generation smoke test
        run: node scripts/ci/run-text-image-smoke.mjs
      - name: Upload text image screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.arch }}-text-images
          path: test-results/
