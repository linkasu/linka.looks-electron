name: Electron test

# 4.x is Windows x64 unsigned CI only. macOS 3.3.1 remains a frozen compatibility asset.

on:
  pull_request:
    types: [opened, reopened, edited, synchronize]
    branches: ["main"]
    paths-ignore:
      - "docs/**"
      - "agents/**"
      - "README*"
      - "**/*.md"

concurrency:
  group: electron-test-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read

jobs:
  build-windows:
    # node-gyp 11 supports VS2022, not windows-latest's VS2026 image.
    runs-on: windows-2022
    timeout-minutes: 25
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.22.2
          cache: "npm"

      - name: Cache Electron downloads
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/electron
            ~/.cache/electron-builder
            ~\AppData\Local\electron\Cache
            ~\AppData\Local\electron-builder\Cache
          key: ${{ runner.os }}-electron-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-electron-

      - name: Install deps
        run: |
          npm ci --ignore-scripts
          npm rebuild pictures.bank-api esbuild electron
          node scripts/ci/provision-eyelog.cjs
      - name: Build unpacked app for packaged resource smoke test
        run: npm run electron:build -- --win --x64 --dir -p never
      - name: Verify approved packaged Windows predictor (not hardware qualification)
        run: node scripts/ci/verify-predictor-resources.cjs dist/win-unpacked/resources win32 x64 build/predictor-approval.json
      - name: Packaged resource smoke test
        id: packaged
        run: npm run test:packaged-resources
      - name: Load native modules with packaged Windows Electron (no hardware access)
        env:
          ELECTRON_RUN_AS_NODE: "1"
        run: |
          & "dist/win-unpacked/LINKa. смотри.exe" node_modules/@linkasu/tobii-electron/native/tobiifree-native/scripts/smoke-test.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & "dist/win-unpacked/LINKa. смотри.exe" -e 'const assert=require("node:assert/strict"); assert.equal(typeof require("usb").getDeviceList,"function"); console.log("USB native load passed; no devices queried");'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Production text image generation smoke test
        timeout-minutes: 5
        run: node scripts/ci/run-text-image-smoke.mjs
      - name: Windows SDK process negative controls (no device)
        id: sdk-controls
        if: ${{ !cancelled() }}
        env:
          EYELOG_SANDBOX_GATE: "1"
        run: node --test scripts/ci/windows-sdk-process.test.cjs scripts/ci/windows-sdk-launch.test.cjs
      - name: Sandboxed packaged Windows SDK launch
        if: ${{ !cancelled() && steps.packaged.outcome == 'success' && steps.sdk-controls.outcome == 'success' }}
        env:
          EYELOG_SANDBOX_GATE: "1"
        run: npm run test:packaged-resources
      - name: Upload text image screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-text-images
          path: test-results/
