name: Electron test

on:
  pull_request:
    types: [opened, reopened, edited, synchronize]
    branches: ['main']

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v4

    - name: Use Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 22.x
        cache: 'npm'

    - name: Install deps
      run: npm ci
    - name: Lint
      run: npm run lint
    - name: Unit tests
      run: npm run test:unit
    - name: Build installer
      run: npm run electron:build -- -p never
    - name: Packaged resource smoke test
      run: npm run test:packaged-resources
    - name: Upload installer
      uses: actions/upload-artifact@v4
      with:
        name: windows-installer
        path: dist

  build-macos:
    runs-on: macos-latest
    steps:
    - uses: actions/checkout@v4

    - name: Use Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 22.x
        cache: 'npm'

    - name: Install deps
      run: npm ci
    - name: Build unpacked app for packaged resource smoke test
      run: npm run electron:build -- --mac --x64 --arm64 --dir
      env:
        CSC_IDENTITY_AUTO_DISCOVERY: false
    - name: Packaged resource smoke test
      run: npm run test:packaged-resources
    - name: Build macOS artifacts
      run: npm run electron:build -- --mac --x64 --arm64 -p never
      env:
        CSC_IDENTITY_AUTO_DISCOVERY: false
    - name: Upload macOS artifacts
      uses: actions/upload-artifact@v4
      with:
        name: macos-artifacts
        path: |
          dist/*.dmg
          dist/*.zip
          dist/*.blockmap
          dist/latest-mac.yml
