name: Checks

on:
  push:
    branches: ["main"]
    paths-ignore:
      - "docs/**"
      - "agents/**"
      - "README*"
      - "**/*.md"
  pull_request:
    types: [opened, reopened, edited, synchronize]
    branches: ["main"]
    paths-ignore:
      - "docs/**"
      - "agents/**"
      - "README*"
      - "**/*.md"

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  checks:
    runs-on: ubuntu-latest
    env:
      CXXFLAGS: -std=gnu++17
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.22.2
          cache: "npm"

      - name: Install Linux native build dependencies
        run: sudo apt-get update && sudo apt-get install -y libudev-dev libopenjp2-tools
      - name: Install deps
        run: |
          npm ci --ignore-scripts
          npm rebuild pictures.bank-api esbuild electron
          node scripts/ci/provision-eyelog.cjs
      - name: Format check
        run: npm run format:check
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Unused code and dependencies
        run: npm run knip
      - name: Checkout pinned predictor source (test resources only)
        uses: actions/checkout@v4
        with:
          repository: linkasu/linka.predictor-rust
          ref: a83c727b4497471740b4ee31ad0ba0a46ea39633
          path: predictor-resources/source
          persist-credentials: false
      - name: Build real predictor and stage the synthetic CC0 model
        timeout-minutes: 10
        run: |
          rustup toolchain install 1.98.0 --profile minimal
          cargo +1.98.0 build --locked --release --manifest-path predictor-resources/source/Cargo.toml -p predictor-cli --bin lp-electron
          install -m 755 predictor-resources/source/target/release/lp-electron predictor-resources/lp-electron
          cp predictor-resources/source/artifacts/tiny/runtime-v1.lpk predictor-resources/model.lpk
      - name: Unit tests
        run: npm run test:unit
      - name: Install browser for standalone keyboard tests
        run: npx playwright install --with-deps chrome
      - name: Standalone keyboard demo and caret tests
        run: |
          npx playwright test --config=playwright.keyboard-prototype.config.ts
          npx playwright test --config=playwright.caret.config.ts
      - name: Candidate builder password separation and hook fixtures (no signing)
        env:
          CANDIDATE_BUILDER: "1"
        run: node --test scripts/ci/candidate-keychain-password.test.cjs scripts/ci/candidate-mac-sign.test.cjs scripts/ci/macos-single-build.test.cjs scripts/ci/provision-eyelog.test.cjs scripts/ci/candidate-eyelog-api.test.cjs scripts/ci/packaged-eyelog.test.cjs scripts/ci/release-artifacts.test.cjs scripts/ci/release-331-preflight.test.cjs
      - name: Strict payload synthetic negative controls
        run: |
          python3 scripts/ci/test-asar-evidence.py
          python3 scripts/ci/test-report-asar-evidence.py
          python3 scripts/ci/test-verify-macos-payload.py
      - name: SDK launch policy negative controls (no executable launch)
        run: node --test scripts/ci/windows-sdk-launch.test.cjs
      - name: Mirror atomic update and rollback tests (no production access)
        run: node --test scripts/mirror/update.test.cjs
      - name: Baseline result validator self-test
        run: node scripts/ci/check-baseline-result.mjs --self-test
